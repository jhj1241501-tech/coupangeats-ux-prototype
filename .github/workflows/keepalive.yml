name: Supabase Keepalive

# Supabase 무료 플랜은 7일 무활동 시 자동 일시정지된다.
# 매일 favorites 테이블에 가벼운 SELECT를 날려 7일 타이머를 리셋한다.
on:
  schedule:
    - cron: "0 15 * * *"   # 매일 15:00 UTC (한국 자정)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Secret 값에 섞였을 수 있는 앞뒤 공백/개행 제거
          URL=$(echo -n "$SUPABASE_URL" | tr -d '[:space:]')
          KEY=$(echo -n "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/favorites?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Keepalive 실패: HTTP $code"
            exit 1
          fi
          echo "Keepalive 성공"
