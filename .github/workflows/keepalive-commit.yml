name: Keepalive Commit

# GitHub은 repo에 60일간 활동(커밋)이 없으면 예약 워크플로를 자동 비활성화한다.
# 매월 1일 빈 커밋을 남겨 repo 활동을 유지 → keepalive.yml 이 계속 살아있게 한다.
on:
  schedule:
    - cron: "0 3 1 * *"   # 매월 1일 03:00 UTC
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit to keep repo active
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive commit [skip ci]"
          git push
